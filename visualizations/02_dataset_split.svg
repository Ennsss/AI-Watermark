<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<title>Dataset and evaluation split</title><rect width="100%" height="100%" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17324D}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#64748B}.axis{font-size:14px;fill:#64748B}.label{font-size:16px}.small{font-size:13px;fill:#64748B}.value{font-size:14px;font-weight:700}</style>
<text x="55.0" y="55.0" class="title" text-anchor="start" >Dataset and evaluation split</text>
<text x="55.0" y="84.0" class="sub" text-anchor="start" >Corpus partitions and the smaller CNN development subsets</text>
<rect x="100" y="170" width="260" height="250" rx="18" fill="#F8FAFC" stroke="#3B82F6" stroke-width="3"/>
<text x="230.0" y="225.0" class="label" text-anchor="middle" font-weight="700">Training pool</text>
<text x="230.0" y="285.0" class="title" text-anchor="middle" >10,000 images</text>
<text x="230.0" y="340.0" class="small" text-anchor="middle" >CNN subset: 500 images</text>
<text x="230.0" y="365.0" class="small" text-anchor="middle" >2 payloads/image → 1,000 pairs</text>
<rect x="450" y="170" width="260" height="250" rx="18" fill="#F8FAFC" stroke="#0F766E" stroke-width="3"/>
<text x="580.0" y="225.0" class="label" text-anchor="middle" font-weight="700">Validation pool</text>
<text x="580.0" y="285.0" class="title" text-anchor="middle" >1,000 images</text>
<text x="580.0" y="340.0" class="small" text-anchor="middle" >CNN subset: 100 images</text>
<text x="580.0" y="365.0" class="small" text-anchor="middle" >2 payloads/image → 200 pairs</text>
<rect x="800" y="170" width="260" height="250" rx="18" fill="#F8FAFC" stroke="#F59E0B" stroke-width="3"/>
<text x="930.0" y="225.0" class="label" text-anchor="middle" font-weight="700">Held-out test</text>
<text x="930.0" y="285.0" class="title" text-anchor="middle" >500 images</text>
<text x="930.0" y="340.0" class="small" text-anchor="middle" >Final benchmark only</text>
<text x="930.0" y="365.0" class="small" text-anchor="middle" >500 × 13 = 6,500 pairs</text>
<text x="55.0" y="485.0" class="label" text-anchor="start" >The development subsets were selected by sorted filename; they were not random or style-stratified.</text>
<text x="55.0" y="520.0" class="small" text-anchor="start" >The 500-image test partition was held out from CNN training, validation, and Δ calibration.</text></svg>