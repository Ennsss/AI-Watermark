version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: web-app/Dockerfile
      target: backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    volumes:
      - ./backend/uploads:/app/web-app/backend/uploads
    command: python main.py
    working_dir: /app/web-app/backend

  frontend:
    build:
      context: ..
      dockerfile: web-app/Dockerfile
      target: frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    command: npm start
    working_dir: /app/web-app/frontend

networks:
  default:
    name: watermark-network
